<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnScreenPrinter — 印刷物の質感シミュレーター</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>OnScreenPrinter</h1>
  <div class="tools">
    <button id="btn-open" type="button" class="primary">画像を開く</button>
    <button id="btn-folder" type="button">フォルダを開く</button>
    <button id="btn-sample" type="button">サンプル</button>
    <span class="sep"></span>
    <button id="btn-fit" type="button" title="全体を表示">フィット</button>
    <button id="btn-100" type="button" title="等倍表示">100%</button>
    <button id="btn-compare" type="button" title="押している間、元画像を表示（スペースキーでも可）">元画像と比較</button>
    <span class="sep"></span>
    <select id="export-scale" aria-label="書き出しサイズ">
      <option value="2048" selected>長辺 2048px</option>
      <option value="4096">長辺 4096px</option>
      <option value="8192">長辺 8192px</option>
    </select>
    <select id="export-format" aria-label="書き出し形式">
      <option value="image/jpeg" selected>JPEG</option>
      <option value="image/png">PNG</option>
    </select>
    <button id="btn-export" type="button" class="primary">書き出し</button>
    <span class="sep"></span>
    <a class="btn" href="manual.html" target="_blank" rel="noopener">マニュアル</a>
  </div>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <input id="folder" type="file" webkitdirectory multiple hidden>
</header>
<main>
  <div id="viewer">
    <section id="stage">
      <canvas id="view"></canvas>
      <div id="hint">画像・フォルダをドラッグ＆ドロップ / 貼り付け　・　ホイールで拡大、ドラッグで移動</div>
      <div id="zoom">100%</div>
      <div id="fatal" hidden></div>
    </section>
    <section id="strip" hidden aria-label="読み込んだ画像">
      <div class="strip-bar">
        <span id="strip-count"></span>
        <span id="strip-status" role="status"></span>
        <span class="grow"></span>
        <button id="btn-clear" type="button">一覧を空にする</button>
        <button id="btn-export-all" type="button" class="primary">すべて書き出し（zip）</button>
      </div>
      <div id="thumbs" role="listbox" aria-label="画像の一覧"></div>
    </section>
  </div>
  <aside id="panel">
    <div class="panel-head">
      <h2>プリセット</h2>
      <button id="btn-reset" type="button">リセット</button>
    </div>
    <div id="presets"></div>
    <div id="controls"></div>
  </aside>
</main>
<script src="js/renderer.js"></script>
<script src="js/sample.js"></script>
<script src="js/zip.js"></script>
<script src="js/app.js"></script>
</body>
</html>
