<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnScreenPrinter — 印刷物の質感シミュレーター</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>OnScreenPrinter</h1>
  <div class="tools">
    <button id="btn-open" type="button" class="primary">画像を開く</button>
    <button id="btn-sample" type="button">サンプル</button>
    <span class="sep"></span>
    <button id="btn-fit" type="button" title="全体を表示">フィット</button>
    <button id="btn-100" type="button" title="等倍表示">100%</button>
    <button id="btn-compare" type="button" title="押している間、元画像を表示（スペースキーでも可）">元画像と比較</button>
    <span class="sep"></span>
    <select id="export-scale" aria-label="書き出しサイズ">
      <option value="1">原寸</option>
      <option value="2" selected>2倍（網点を精細に）</option>
    </select>
    <button id="btn-export" type="button" class="primary">PNG 書き出し</button>
    <span class="sep"></span>
    <a class="btn" href="manual.html" target="_blank" rel="noopener">マニュアル</a>
  </div>
  <input id="file" type="file" accept="image/*" hidden>
</header>
<main>
  <section id="stage">
    <canvas id="view"></canvas>
    <div id="hint">画像をドラッグ＆ドロップ / 貼り付け　・　ホイールで拡大、ドラッグで移動</div>
    <div id="zoom">100%</div>
    <div id="fatal" hidden></div>
  </section>
  <aside id="panel">
    <div class="panel-head">
      <h2>プリセット</h2>
      <button id="btn-reset" type="button">リセット</button>
    </div>
    <div id="presets"></div>
    <div id="controls"></div>
  </aside>
</main>
<script src="js/renderer.js"></script>
<script src="js/sample.js"></script>
<script src="js/app.js"></script>
</body>
</html>
